<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hawker Hub</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Singapore hawker finder</p>
        <h1>Hawker Hub 🍜</h1>
        <p class="tagline">Find your next makan in Singapore</p>
      </header>

      <section class="controls" aria-label="Stall filters">
        <label>
          Search stalls
          <input id="search" type="search" placeholder="Try laksa, Maxwell, satay..." autocomplete="off">
        </label>
        <label>
          Sort by
          <select id="sort">
            <option value="rating">Rating</option>
            <option value="name">Name</option>
            <option value="price">Price</option>
          </select>
        </label>
      </section>

      <p id="status" class="status" role="status" aria-live="polite">Loading stalls...</p>
      <section id="stall-grid" class="grid" aria-label="Hawker stalls"></section>
    </main>
  </body>
</html>
